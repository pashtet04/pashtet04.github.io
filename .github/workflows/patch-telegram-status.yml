name: Patch Telegram status

on:
  push:
    paths:
      - ".github/workflows/patch-telegram-status.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show fallback state when Telegram sync fails
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          old = "document.getElementById('telegram-state').textContent='auto-updated'"
          new = "document.getElementById('telegram-state').textContent=post.error?'open channel':'auto-updated'"
          if old not in html:
              raise RuntimeError("Telegram status marker not found")
          path.write_text(html.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show Telegram sync fallback state"
          git push
