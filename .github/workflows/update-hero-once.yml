name: Update hero positioning once

on:
  push:
    paths:
      - ".github/workflows/update-hero-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "Kubernetes / platforms / production systems": "Secure Kubernetes platforms / AI / data / real-time systems",
              "Principal SRE / Platform Engineer with 10+ years of experience in Kubernetes, cloud infrastructure, CI/CD, observability and databases.": "Secure Kubernetes platforms for AI, data and real-time voice systems — from cloud networking and GitOps delivery to secrets, observability and disaster recovery.",
              "Kubernetes · Terraform · GitOps · CI/CD · Observability · Databases": "Cloud networking · GitOps · Secrets · Observability · Disaster recovery",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit hero update and remove one-time workflow
        run: |
          git rm .github/workflows/update-hero-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine hero positioning"
          git push
