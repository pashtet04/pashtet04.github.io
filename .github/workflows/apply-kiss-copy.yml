name: Apply KISS copy

on:
  push:
    paths:
      - "scripts/apply_kiss_copy.py"
      - ".github/workflows/apply-kiss-copy.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/apply_kiss_copy.py
      - name: Commit simplified copy
        run: |
          rm -f scripts/apply_kiss_copy.py .github/workflows/apply-kiss-copy.yml
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify site copy with KISS"
          git push
