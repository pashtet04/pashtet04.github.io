name: One-time troubleshooting copy patch

on:
  push:
    paths:
      - ".github/workflows/one-time-approach-copy.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = '<p class="lead-detail">Reliability, CI/CD, networking, databases, secrets and observability. AI, data and voice workloads.</p>'
          new = '<p class="lead-detail">Kubernetes, GitLab, CI/CD, databases, messaging, storage, observability and networking.</p><p class="lead-detail">Complex production problems are often unclear at first. Narrow the scope, test hypotheses with data, find the root cause, fix it and verify the result.</p>'
          if old not in text:
              raise SystemExit('Expected hero copy not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git rm .github/workflows/one-time-approach-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add troubleshooting approach to hero"
          git push
