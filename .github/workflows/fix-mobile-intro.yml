name: Fix mobile hero overlap

on:
  push:
    paths:
      - "scripts/fix_mobile_intro.py"
      - ".github/workflows/fix-mobile-intro.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fix_mobile_intro.py
      - name: Commit fix and clean up
        run: |
          rm -f scripts/fix_mobile_intro.py .github/workflows/fix-mobile-intro.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile hero label overlap"
          git push
